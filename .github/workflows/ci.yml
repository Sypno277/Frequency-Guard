name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    name: Python lint / type / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_services/frequency_guard/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check python_services/frequency_guard tests/python

      - name: Format (black)
        run: black --check python_services/frequency_guard tests/python

      - name: Type check (mypy)
        run: mypy python_services/frequency_guard

      - name: Security scan (pip-audit)
        run: pip-audit

      - name: Unit + integration + regression + robustness tests
        run: pytest --cov=python_services/frequency_guard --cov-report=term-missing -m "not perf"

      - name: Performance gates
        run: pytest -m perf

      - name: Build honest train/holdout split
        run: python -m scripts.build_split

      - name: Held-out regression gate (real-FPR <= 2%, AI recall >= 80%)
        run: python -m scripts.eval_holdout --no-save

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
        if: always()

  frontend-checks:
    name: Frontend lint / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
